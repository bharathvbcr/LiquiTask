[package]
name = "liquitask"
version = "2.6.1"
description = "A premium Kanban task management desktop app with a stunning liquid glass aesthetic"
authors = ["LiquidTask <support@liquitask.com>"]
edition = "2021"
rust-version = "1.77"

# The binary that boots the desktop app.
[[bin]]
name = "liquitask"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform canonicalize that does not emit Windows \\?\ verbatim prefixes,
# so resolved paths stay comparable to the stored workspace allowlist.
dunce = "1"
aes-gcm = "0.10"
base64 = "0.22"
keyring = "3"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
fastembed = "4"
chrono = { version = "0.4", features = ["serde"] }
liquitask-core = { path = "../crates/liquitask-core" }
# Bundled: statically links SQLite, no system dependency. Backs the agentd
# run/event/agent index (Rework Plan §3.3) — separate from the file-based
# run_store.rs journal, which stays as-is for the legacy claude-only runner.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
# Process-group liveness (kill -0) + subtree kill for durable/headless agent runs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[dev-dependencies]
# Real temp SQLite files for agent_devcouncil_evidence.rs tests (mirrors a real
# .devcouncil/state.db, not just an in-memory fixture).
tempfile = "3"

[features]
# This feature is used for production builds or when a dev server is not running.
custom-protocol = ["tauri/custom-protocol"]
