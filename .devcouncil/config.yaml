commands:
  lint:
  - npm run lint
  - flake8
  - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
  - cargo clippy --manifest-path crates/liquitask-core/Cargo.toml --all-targets
  - go -C liquitask-agentd vet ./...
  test:
  - npm run test:run
  - pytest
  - cargo test --manifest-path src-tauri/Cargo.toml
  - cargo test --manifest-path crates/liquitask-core/Cargo.toml
  - go -C liquitask-agentd test ./...
  typecheck:
  - npm run typecheck
  - mypy
execution:
  checkpoint_before_each_task: true
  default_executor: native
  max_repair_attempts: 3
gates:
  block_dependency_changes_without_approval: true
  block_failed_commands: true
  block_missing_tests_for_high_requirements: true
  block_orphan_diffs: true
  block_schema_change_without_migration: true
  require_clean_git_before_task: true
integrations:
  agent_flow:
    enabled: true
    mode: jsonl
    trace_path: .devcouncil/logs/traces.jsonl
  code_review_graph:
    command: code-review-graph
    enabled: true
    optional: true
models:
  provider: openrouter
  roles:
    arbiter:
      model: openai/gpt-5.1
    critic_a:
      model: openai/gpt-5.1
    critic_b:
      model: anthropic/claude-opus-4.8
    implementation_reviewer:
      model: openai/gpt-5.1
    native_agent:
      model: anthropic/claude-sonnet-5
    planner_a:
      model: anthropic/claude-sonnet-5
    planner_b:
      model: google/gemini-2.5-pro
    spec_writer:
      model: anthropic/claude-sonnet-5
privacy:
  redact_env_vars: true
  redact_secrets_in_logs: true
  store_prompts_locally: true
project:
  default_branch: main
  name: LiquiTask
  root: .
