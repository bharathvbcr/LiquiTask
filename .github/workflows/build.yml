name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation

jobs:
  go-test:
    name: Go (liquitask-agentd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquitask-agentd
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: liquitask-agentd/go.mod
          cache-dependency-path: liquitask-agentd/go.sum

      - name: Run Go tests
        run: go test ./...

  rust-test:
    name: Rust (liquitask-core + src-tauri)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            crates/liquitask-core
            src-tauri

      - name: Run liquitask-core tests
        run: cargo test --manifest-path crates/liquitask-core/Cargo.toml

      - name: Run src-tauri tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            rust-targets: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
            artifact-name: liquitask-release-macos
            artifact-path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ''
            tauri-args: ''
            artifact-name: liquitask-release-windows
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: liquitask-agentd/go.mod
          cache-dependency-path: liquitask-agentd/go.sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --loglevel=error --fund=false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build sidecars
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run prepare:semantic-sidecar-stub:win
          fi
          npm run build:semantic-sidecar
          npm run build:agentd

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:run

      # Only inject the Apple signing/notarization vars when a real certificate
      # secret is configured. They must be *absent* (not empty) otherwise: Tauri
      # treats a present-but-empty APPLE_CERTIFICATE as a cert to import and fails
      # at `security import`. With them unset, the build falls back to the ad-hoc
      # `signingIdentity: "-"` in tauri.macos.conf.json (still a valid signature).
      - name: Configure macOS signing
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID certificate present — enabling signing + notarization."
            {
              echo "APPLE_CERTIFICATE<<__EOF__"
              echo "$APPLE_CERTIFICATE"
              echo "__EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple certificate secret — using ad-hoc signing from tauri.macos.conf.json."
          fi

      # Windows Authenticode signing (clears the Chrome/SmartScreen warning).
      # No-op without the secret: it only writes the auto-merged
      # tauri.windows.conf.json (with the cert thumbprint) when a real PFX is
      # present, so the default build still produces an unsigned installer.
      - name: Configure Windows signing
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Output "No Windows certificate secret - producing an unsigned installer."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "win-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx -Force
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 6
          $conf | Out-File -FilePath "src-tauri/tauri.windows.conf.json" -Encoding utf8
          Write-Output "Windows signing enabled (thumbprint $($cert.Thumbprint))."

      - name: Build Tauri App
        run: npm run tauri build -- ${{ matrix.tauri-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: ignore
