name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in vX.Y.Z format'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation

jobs:
  go-test:
    name: Go (liquitask-agentd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquitask-agentd
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: liquitask-agentd/go.mod
          cache-dependency-path: liquitask-agentd/go.sum

      - name: Run Go tests
        run: go test ./...

  rust-test:
    name: Rust (liquitask-core + src-tauri)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            crates/liquitask-core
            src-tauri

      - name: Run liquitask-core tests
        run: cargo test --manifest-path crates/liquitask-core/Cargo.toml

      - name: Run src-tauri tests
        working-directory: src-tauri
        run: cargo test

  release:
    name: Build ${{ matrix.name }} installer
    needs: [go-test, rust-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: ''
            package-command: npm run build
            artifact-name: liquitask-release-windows
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
            release-files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-14
            rust-targets: aarch64-apple-darwin
            package-command: npm run build:mac
            artifact-name: liquitask-release-macos
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            release-files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "${{ steps.release_tag.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: liquitask-agentd/go.mod
          cache-dependency-path: liquitask-agentd/go.sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --loglevel=error --fund=false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "Tag ${TAG} does not match package version v${VERSION}"
            exit 1
          fi

      # See build.yml: inject Apple signing vars only when a real certificate
      # secret exists, otherwise the build ad-hoc signs from tauri.macos.conf.json.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID certificate present — enabling signing + notarization."
            {
              echo "APPLE_CERTIFICATE<<__EOF__"
              echo "$APPLE_CERTIFICATE"
              echo "__EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple certificate secret — using ad-hoc signing from tauri.macos.conf.json."
          fi

      # See build.yml: no-op without the secret; writes the auto-merged
      # tauri.windows.conf.json with the cert thumbprint when a real PFX exists.
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Output "No Windows certificate secret - producing an unsigned installer."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "win-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx -Force
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 6
          $conf | Out-File -FilePath "src-tauri/tauri.windows.conf.json" -Encoding utf8
          Write-Output "Windows signing enabled (thumbprint $($cert.Thumbprint))."

      - name: Build and Package Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.package-command }}

      - name: Fail closed on unsigned macOS release
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE == ''
        run: |
          echo "Release job requires APPLE_CERTIFICATE — refusing to publish an ad-hoc macOS build."
          exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Generate artifact checksums
        shell: bash
        run: |
          shopt -s nullglob
          for f in ${{ matrix.release-files }}; do
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LiquiTask ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ matrix.release-files }}
            SHA256SUMS.txt
